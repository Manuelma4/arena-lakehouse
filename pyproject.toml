[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-lakehouse"
version = "0.7.0"
description = "Reproducible football and VALORANT data engineering lab"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "pyarrow>=19,<24", "numpy>=2,<3", "scikit-learn>=1.6,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "PyYAML>=6,<7", "jsonschema>=4,<5"]
spark = ["pyspark==4.1.3", "delta-spark==4.4.0"]

[project.scripts]
arena-lakehouse = "arena_lakehouse.cli:main"
arena-spark = "arena_lakehouse.incremental:main"
arena-scale = "arena_lakehouse.scale:main"
arena-live = "arena_lakehouse.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena_lakehouse = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
